contract_version: "0.1"
id: example-authenticated-portal
domains:
  - portal.example.com
preferred_engines:
  - playwright-observer
auth_mode: dedicated_profile
allowed_modes:
  - read
  - observe
  - interact
  - commit
approval_risks:
  - external_upload
  - external_submit
  - destructive
known_failures:
  login_expired: pause_for_reauthentication
  layout_changed: reacquire_observation
retention:
  screenshots: prohibited
  har: metadata_only
browser_observation:
  javascript: disabled
  network_methods: get_head_only
  credential_scope: read_only
notes:
  - Template only. Do not use this profile as an actual allowlist.
