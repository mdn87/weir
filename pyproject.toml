[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lugos-weir"
version = "0.8.0"
description = "WEIR - Web Evidence, Interaction & Retrieval for Lugos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Matthew Newman"}]
dependencies = ["PyYAML>=6.0", "cryptography>=42.0"]

[project.optional-dependencies]
test = ["jsonschema>=4.21", "pytest>=8", "Pillow>=11,<13"]
browser = ["playwright>=1.61,<2"]
visual = ["Pillow>=11,<13"]

[project.scripts]
weir = "weir.cli:main"
weir-operator-rpc = "weir.operator_rpc:main"
weir-dias-snapshot = "weir.dias_reports:publish_main"
weir-canary = "weir.linux_field.cli:main"
weir-field-host = "weir.linux_field.runtime:main"
weir-field-browser-driver = "weir.linux_field.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weir = ["data/windows/*.ps1", "data/windows/*.txt"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.unittest]
start-directory = "tests"
