[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lugos-weir"
version = "0.0.1"
description = "WEIR - Web Evidence, Interaction & Retrieval for Lugos"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Matthew Newman"}]
dependencies = []

[project.scripts]
weir = "weir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
